name: Feature request
description: Suggest an idea for the Claude Workbench app
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How should the app behave? Mention alternatives you considered.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "3.1.0"
